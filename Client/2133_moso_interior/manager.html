            <script>
                  function productShow()
                {
                   const productList=document.getElementById('productList')
                   productList.style.display='block';
                   fetchProducts();
                }
                function orderShow()
                {                  
                    const orderList = document.getElementById('ordersList');
                    orderList.style.display = 'block'; 
                    fetchOrders();                    
                }
                function membersShow()
                {                  
                    const usersList = document.getElementById('usersList');
                    usersList.style.display = 'block'; 
                    fetchUsers();                    
                }
                async function fetchUsers() {
                try {
                    
                    const response = await fetch('http://localhost:3284/users', {
                        method: 'GET',
                        mode: 'cors',
                        credentials: 'include' 
                    });
                   
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }

                    const text = await response.text();
                     // See raw response
                    const data = JSON.parse(text); 
                    
                    populateUserTable(data); 
                    
                } 
                catch (error) {
                    console.error('Error fetching users:', error);
                }
            }
            async function fetchOrders() {
                try {
                    
                    const response = await fetch('http://localhost:3284/order', {
                        method: 'GET',
                        mode: 'cors',
                        credentials: 'include' 
                    });
                   
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }

                    const text = await response.text();
                      // See raw response
                    const data = JSON.parse(text); 
                    
                    populateOrderTable(data); 
                    
                } 
                catch (error) {
                    console.error('Error fetching users:', error);
                }
            }
            function populateUserTable(data) {
            
        
            const tableBody = document.querySelector("#userTable tbody");
            tableBody.innerHTML = ''; 

            data.forEach(user => {
                const row = document.createElement('tr');

                row.innerHTML = `
                <td>${user.fullname}</td>
                <td>${user.password}</td>
                <td>${user.email}</td>
                <td>${user.phone}</td>
                <td>${user.address}</td>
                `;

                tableBody.appendChild(row);
            });
            }
            function populateOrderTable(data) {
            

            const tableBody = document.querySelector("#orderTable tbody");
            tableBody.innerHTML = ''; 

            data.forEach(order => {
                const row = document.createElement('tr');

                row.innerHTML = `
                <td>${order.orderId}</td>
                <td>${order.email}</td>
                <td>${order.quantity}</td>
                <td>${order.orderDate}</td>
                <td>${order.productsId}</td>
                <td>${order.status}</td>
                `;

                tableBody.appendChild(row);
            });
            }
          

               async function fetchProducts() {
                try {
                    
                    const response = await fetch('http://localhost:3284/product', {
                        method: 'GET',
                        mode: 'cors',
                        credentials: 'include' 
                    });
                   
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }

                    const text = await response.text();
                     // See raw response
                    const data = JSON.parse(text); 
                    
                    populateProductTable(data); 
                    
                } 
                catch (error) {
                    console.error('Error fetching users:', error);
                }
            }
            function populateProductTable(data) {
            
              
            const tableBody = document.querySelector("#productTable tbody");
            tableBody.innerHTML = ''; 

            data.forEach(product => {
                const row = document.createElement('tr');

                row.innerHTML = `
                <td>${product.productId}</td>
                <td>${product.name}</td>
                <td class="price-display">${product.price}</td>
                <td>${product.category}</td>
                <td class="stock-display">${product.stock}</td>              
                <td><button class="btn btn-outline-danger btn-sm" onclick="deleteProduct('${product._id}', this)">🗑️ מחק</button></td>
           

            <td>
            <input type="number" min="0" class="form-control form-control-sm"
                    value="${product.stock}"
                    onchange="updateProductStock('${product._id}', this)">
            </td>

                            <td>
            <input type="number" min="0" step="0.01" class="form-control form-control-sm"
                    value="${product.price}"
                    onchange="updateProductPrice('${product._id}', this)">
            </td>

                `;

                tableBody.appendChild(row);
            });
            }
    
              
         function deleteProduct(id, btnElement) {
    fetch(`http://localhost:3284/product`, {
        method: 'DELETE',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({ _id: id })
    })
    .then(res => res.json())
    .then(() => {
       
        const row = btnElement.closest('tr');
        if (row) {
            row.remove();
        }
        
    })
    .catch(err => console.error('Error deleting product:', err));
}
   
function updateProductPrice(productId, inputElement) {
  const newPrice = parseFloat(inputElement.value);

  fetch(`http://localhost:3284/product/price/${productId}`, {
    method: 'PUT',
    headers: {
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({ price: newPrice })
  })
  .then(res => res.json())
  .then(data => {
        console.log('Price update successful:', data);
        const updatedProduct = data.product;
        const row = inputElement.closest('tr'); 
        
        if (row && updatedProduct) {
           
            const priceDisplayCell = row.querySelector('.price-display');
            
          
            const stockDisplayCell = row.querySelector('.stock-display'); 

            if (priceDisplayCell) {
               
                priceDisplayCell.textContent = updatedProduct.price; 
            }
            if (stockDisplayCell) { 
                stockDisplayCell.textContent = updatedProduct.stock;
            }
        }
    })
  .catch(error => {
    console.error('Error updating price:', error);
  });
}


function updateProductStock(productId, inputElement) {
  const newStock = inputElement.value;

  fetch(`http://localhost:3284/product/stock`, {
    method: 'PUT', 
    headers: {
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({ _id: productId, stock: Number(newStock) })
  })
  .then(res => res.json())
.then(data => {
  console.log('Updated product from server:', data);
  const updatedProduct = data.product; 
  const row = inputElement.closest('tr');
  if (row) {
    const stockDisplayCell = row.querySelector('.stock-display');
    if (stockDisplayCell && updatedProduct) {
      stockDisplayCell.textContent = updatedProduct.stock;
    }
  }
})
  .catch(err => {
    console.error('Error updating stock:', err);
  });
}

            </script>
