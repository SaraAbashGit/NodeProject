<section>


<div class="container">
<h2>Order summary</h2>
<ul id="cart-products-list"></ul>

    <h2 class="mb-4">shopping cart:</h2>
       

    <ul id="cart-items" class="list-group mb-3"></ul>
    <p id="empty-msg" class="text-muted">your cart is empty</p>
     <div id="cart-summary" class="mt-4" style="display:none;">
<p>Total to be paid: <span id="cart-sum"></span></p>
                <button id="to-payment" class="btn btn-warning mt-3">המשך לתשלום</button>
        
  </div>


    
</section>

            
    <script>
document.addEventListener('DOMContentLoaded', function() {
    // שליפת המוצרים והסכום מה-localStorage
    const cartProducts = JSON.parse(localStorage.getItem('cartItems')) || [];
    const cartSum = localStorage.getItem('cartSum') || 0;

    // אלמנטים מהדף
    const ulList = document.getElementById('cart-products-list');
    const sumSpan = document.getElementById('cart-sum');
    const list = document.getElementById('cart-items');
    const emptyMsg = document.getElementById('empty-msg');
    const totalSumSpan = document.getElementById('total-sum');
    const summaryDiv = document.getElementById('cart-summary');
    const toPaymentBtn = document.getElementById('to-payment');

    // הצגת רשימת מוצרים מסכימה מקודמת
    // ulList.innerHTML = '';
    // cartProducts.forEach(prod => {
    //     const li = document.createElement('li');
    //     li.textContent = prod.title + " - " + prod.price;
    //     ulList.appendChild(li);
    // });

    // הצגת הסכום
sumSpan.textContent ='$ '+ Number(cartSum).toLocaleString() ;
   // totalSumSpan.textContent = cartSum + ' $';

    // הצגת הסיכום בתחתית
    if (cartProducts.length > 0) {
        emptyMsg.style.display = 'none';
        summaryDiv.style.display = 'block';
    } else {
        emptyMsg.style.display = 'block';
        summaryDiv.style.display = 'none';
    }

    // הצגת סל קניות עם אפשרות להסרה
    list.innerHTML = '';
    cartProducts.forEach((item, idx) => {
        const li = document.createElement('li');
        li.className = 'list-group-item d-flex justify-content-between align-items-center';
        li.innerHTML = `<span>${item.title} <strong>(${item.price} )</strong></span>`;

        const removeBtn = document.createElement('button');
        removeBtn.textContent = 'הסר';
        removeBtn.className = 'btn btn-danger btn-sm';
        removeBtn.onclick = function() {
            cartProducts.splice(idx, 1);
            // חישוב סכום מחדש
            let newSum = cartProducts.reduce((acc, p) => {
                let price = parseFloat((p.price + '').replace(/[^\d\.]/g,''));
                return acc + (isNaN(price) ? 0 : price);
            }, 0);
            // עדכון localStorage
            localStorage.setItem('cartItems', JSON.stringify(cartProducts));
            localStorage.setItem('cartSum', newSum);
            // רענון הדף
            location.reload();
        };

        li.appendChild(removeBtn);
        list.appendChild(li);
    });

    // כפתור המשך לתשלום
    toPaymentBtn.onclick = function() {
        window.location.href = 'payment.html';
    };
});
</script>
